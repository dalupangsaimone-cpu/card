<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Birthday Card</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Poppins', sans-serif;
    }

    body{
        height:100vh;
        overflow:hidden;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#ffd6ec,#ffe8a3);
    }

    /* Animated Background */
    .background{
        position:fixed;
        width:100%;
        height:100%;
        overflow:hidden;
        z-index:-1;
    }

    .nailong{
        position:absolute;
        width:90px;
        animation:float 12s linear infinite;
        opacity:0.9;
    }

    @keyframes float{
        0%{
            transform:translateY(110vh) rotate(0deg);
        }
        100%{
            transform:translateY(-120vh) rotate(360deg);
        }
    }

    /* Card */
    .card{
        width:350px;
        background:rgba(255,255,255,0.2);
        backdrop-filter:blur(10px);
        border-radius:25px;
        padding:30px;
        text-align:center;
        box-shadow:0 8px 25px rgba(0,0,0,0.2);
        border:2px solid rgba(255,255,255,0.3);
        animation:pop 1s ease;
    }

    @keyframes pop{
        from{
            transform:scale(0.5);
            opacity:0;
        }
        to{
            transform:scale(1);
            opacity:1;
        }
    }

    h1{
        color:#ff4f8b;
        margin-bottom:15px;
        font-size:2.2rem;
    }

    .message{
        color:#333;
        font-size:1rem;
        line-height:1.7;
        margin-bottom:20px;
    }

    .heart{
        font-size:2rem;
        animation:heartbeat 1s infinite;
    }

    @keyframes heartbeat{
        0%,100%{
            transform:scale(1);
        }
        50%{
            transform:scale(1.2);
        }
    }

    .footer{
        margin-top:15px;
        color:#555;
        font-size:0.9rem;
    }
</style>
</head>

<body>

<!-- Animated Nailong Background -->
<div class="background">
    <img class="nailong" src="https://i.imgur.com/8Km9tLL.png" style="left:5%; animation-duration:14s;">
    <img class="nailong" src="https://i.imgur.com/8Km9tLL.png" style="left:25%; animation-duration:10s; width:70px;">
    <img class="nailong" src="https://i.imgur.com/8Km9tLL.png" style="left:45%; animation-duration:16s;">
    <img class="nailong" src="https://i.imgur.com/8Km9tLL.png" style="left:65%; animation-duration:11s; width:80px;">
    <img class="nailong" src="https://i.imgur.com/8Km9tLL.png" style="left:85%; animation-duration:13s;">
</div>

<!-- Birthday Card -->
<div class="card">
    <h1>🎂 Happy Birthday! 🎉</h1>

    <p class="message">
        Wishing you a day filled with happiness, laughter, 
        sweet surprises, and unforgettable memories.  
        May all your dreams come true and your smile 
        shine brighter every year! 🌟
    </p>

    <div class="heart">💖</div>

    <div class="footer">
        Made with love 💌
    </div>
</div>

</body>
</html>
